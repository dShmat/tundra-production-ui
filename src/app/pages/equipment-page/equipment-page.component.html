<main class="mx-auto max-w-6xl px-4 py-20">
  <header class="mt-8 max-w-3xl">
    <h1 class="text-4xl font-semibold tracking-tight md:text-5xl">{{ i18n.copy().equipment.title }}</h1>
    <p class="mt-4 text-lg leading-relaxed text-slate-600">{{ i18n.copy().equipment.intro }}</p>
  </header>

  <div class="mt-8 p-3">
    <div class="flex flex-wrap gap-2 text-sm" role="group" [attr.aria-label]="i18n.copy().nav.equipment">
      <button type="button" class="btn btn--soft cursor-pointer" [class.active]="!isDefined(typeSig())" (click)="setType(undefined)">
        {{ i18n.copy().equipment.all }}
      </button>
      @for (category of categories; track category) {
        <button type="button" class="btn btn--soft cursor-pointer" [class.active]="typeSig() === category" (click)="setType(category)">
          {{ i18n.copy().equipment.categories[category] }}
        </button>
      }
    </div>
  </div>

  <ul class="mt-6 grid grid-cols-1 gap-x-8 gap-y-2 sm:grid-cols-2 md:grid-cols-3">
    @for (item of equipment$(); track item.name) {
      <li class="border-b border-slate-200 py-3">
        <span class="font-medium">{{ item.name }}</span>
        <span class="text-slate-500"> — <bdi>{{ item.number }}</bdi> {{ i18n.copy().equipment.unit }}</span>
      </li>
    }
  </ul>
</main>
