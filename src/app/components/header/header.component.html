<header class="fixed top-0 left-0 right-0 z-50">
  <div class="glass px-4 md:px-8 py-3" [class.glass]="isScrolled()" [class.blured]="isScrolled()">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <a class="flex items-center gap-3" [routerLink]="i18n.pageUrl('home')" aria-label="Tundra Studio">
        @if (isHeroEndScrolled() || !isHome()) {
          <img src="icons/tundra-logo-black.svg" class="h-4 rounded-md" alt="Tundra Studio">
        } @else {
          <img src="icons/tundra-logo-white.svg" class="h-4 rounded-md" alt="Tundra Studio">
        }
      </a>
      <nav class="hidden md:flex items-center gap-4 text-sm" [class.text-black]="isHeroEndScrolled() || !isHome()"
           [class.text-white]="!isHeroEndScrolled() && isHome()">
        <a class="px-3 py-2 rounded hover:bg-white/30" [href]="i18n.sectionUrl('spaces')">{{ i18n.copy().nav.spaces }}</a>
        <a class="px-3 py-2 rounded hover:bg-white/30" [routerLink]="i18n.pageUrl('equipment')">{{ i18n.copy().nav.equipment }}</a>
        <a class="px-3 py-2 rounded hover:bg-white/30" [href]="i18n.sectionUrl('price')">{{ i18n.copy().nav.price }}</a>
        <a class="px-3 py-2 rounded hover:bg-white/30" [href]="i18n.sectionUrl('contact')">{{ i18n.copy().nav.contact }}</a>
        <ts-language-switcher />
        <button type="button" (click)="openContactDialog()" class="btn btn--whatsap inline-flex">{{ i18n.copy().nav.talk }}
          <img src="icons/whatsapp-white-icon.svg" [alt]="i18n.copy().home.socialAlt.whatsapp">
        </button>
      </nav>
      <div class="md:hidden flex items-center"
           [class.text-black]="isHeroEndScrolled() || !isHome()"
           [class.text-white]="!isHeroEndScrolled() && isHome()">
        <button type="button" (click)="openContactDialog()" class="btn btn--whatsap inline-flex">{{ i18n.copy().nav.talk }}
          <img src="icons/whatsapp-white-icon.svg" [alt]="i18n.copy().home.socialAlt.whatsapp">
        </button>
        <ts-language-switcher />
        <button type="button" class="px-3 py-2 rounded" (click)="mobileOpen.set(!mobileOpen())" aria-label="Menu">
                <span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" stroke="currentColor"
                         stroke-width="2">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </span>
        </button>
      </div>
    </div>
  </div>
  <div class="md:hidden px-4 bg-white/70 backdrop-blur-md transition-all duration-300 overflow-hidden grid opacity-0
    [grid-template-rows:0fr] origin-top bg-white"
       [ngClass]="mobileOpen() ? 'glass opacity-100 [grid-template-rows:1fr]' : 'pointer-events-none'">
    <div class="min-h-0 py-2">
      <nav class="max-w-7xl mx-auto flex flex-col gap-1 text-sm">
        <a class="px-3 py-2 rounded hover:bg-white/30" [href]="i18n.sectionUrl('spaces')" (click)="mobileOpen.set(false)">{{ i18n.copy().nav.spaces }}</a>
        <a class="px-3 py-2 rounded hover:bg-white/30" [routerLink]="i18n.pageUrl('equipment')" (click)="mobileOpen.set(false)">{{ i18n.copy().nav.equipment }}</a>
        <a class="px-3 py-2 rounded hover:bg-white/30" [href]="i18n.sectionUrl('price')" (click)="mobileOpen.set(false)">{{ i18n.copy().nav.price }}</a>
        <a class="px-3 py-2 rounded hover:bg-white/30" [href]="i18n.sectionUrl('contact')" (click)="mobileOpen.set(false)">{{ i18n.copy().nav.contact }}</a>
      </nav>
    </div>
  </div>
</header>
