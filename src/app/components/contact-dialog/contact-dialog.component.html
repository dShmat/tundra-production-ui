<div class="p-4">
  <h2 class="text-xl font-semibold mb-2">{{ i18n.copy().contactDialog.title }}</h2>
  <p class="text-sm opacity-80 mb-4">{{ i18n.copy().contactDialog.description }}</p>

  <form class="grid grid-cols-1 gap-3">
    <input class="glass rounded-md px-3 py-2 placeholder-gray-400 text-xs" [placeholder]="i18n.copy().contactDialog.fullName" [(ngModel)]="model.contactName" name="name">
    <input type="tel" required class="glass rounded-md px-3 py-2 placeholder-gray-400 text-xs" [placeholder]="i18n.copy().contactDialog.phone" [(ngModel)]="model.phone" name="phone">
    <input type="email" required class="glass rounded-md px-3 py-2 placeholder-gray-400 text-xs" [placeholder]="i18n.copy().contactDialog.email" [(ngModel)]="model.email" name="email">
    <textarea class="glass rounded-md px-3 py-2 placeholder-gray-400 text-xs" [placeholder]="i18n.copy().contactDialog.message" [(ngModel)]="model.message" name="message"></textarea>
  </form>

  <div class="flex justify-end mt-4">
    <a class="btn btn--primary"
       [attr.aria-disabled]="!model.phone && !model.email && !model.contactName"
       [class.pointer-events-none]="!model.phone && !model.email && !model.contactName"
       [href]="waLink(contacts.whatsapp)" target="_blank" rel="noopener"
       (click)="close()">
      {{ i18n.copy().contactDialog.send }}
    </a>
  </div>

</div>
